<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
     
     <h1>Reset Password Form</h1>

    <form action="/reset/" method="post">
        {% csrf_token %}
    <input type="email" placeholder="Enter Your Email:" name="username">
    <br><br>
    <input type="password" placeholder="Enter Your Old Password:" name="old_password">
    <br><br>
    <input type="password" placeholder="Enter Your New Password:" name="new_password">
    <br><br>
    <button class="btn btn-primary">Reset</button>

    </form>
</body>
</html>
