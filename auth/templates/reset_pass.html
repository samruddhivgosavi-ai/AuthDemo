<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
     
     <h1>Reset Password Form</h1>

    <form action="/reset/" method="post">
        {% csrf_token %}
    <input type="email" placeholder="Enter Your Email:" name="username">
    <br><br>
    <input type="password" placeholder="Enter Your Old Password:" name="old password">
    <br><br>
    <input type="password" placeholder="Enter Your New Password:" name="new password">
    <br><br>
    <button class="btn btn-primary">Reset</button>

    </form>
</body>
</html>
